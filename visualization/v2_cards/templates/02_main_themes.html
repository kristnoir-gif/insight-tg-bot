<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Main themes</title>
<link rel="stylesheet" href="_base.css">
<style>
  .top-title {
    position: absolute;
    top: 130px; left: 0; width: 1080px;
    text-align: center;
    font-family: 'TT Nooks Script Edu', serif;
    font-weight: 700;
    font-size: 120px;
    line-height: 1.0;
  }
  /* Более яркое сердце, как в макетах с pill'ами */
  .heart-big {
    position: absolute;
    left: 50%; top: 720px;
    transform: translateX(-50%);
    width: 980px; height: 900px;
    pointer-events: none;
  }
  .heart-big::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 50% 35%, rgba(255,150,200,0.45) 0%, rgba(255,150,200,0) 65%),
      radial-gradient(ellipse 40% 35% at 30% 60%, rgba(220,80,150,0.35) 0%, rgba(220,80,150,0) 60%),
      radial-gradient(ellipse 40% 35% at 70% 60%, rgba(220,80,150,0.35) 0%, rgba(220,80,150,0) 60%);
    filter: blur(2px);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="bg-dark"></div>
    <div class="heart-big"></div>
    <div class="top-title">главные<br>темы</div>
    <!-- channel name + theme pills рисуются PIL'ом -->
    <div class="brand-logo">INSIGHT</div>
    <div class="branding"><span class="pill">@insight_tg_bot</span></div>
  </div>
</body>
</html>
